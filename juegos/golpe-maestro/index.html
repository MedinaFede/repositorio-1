<style>
:root{--bg:#080d1b;--card:#141c35;--card2:#1b2443;--ink:#f0f4ff;--muted:#9ba9ca;--gold:#f8bd5b;--green:#48e3a7;--pink:#fb6e98;--blue:#87a9ff;--stroke:#2c385b}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100svh;background:radial-gradient(ellipse 100% 32% at 50% -10%,#213a67 0,transparent 90%),radial-gradient(ellipse 50% 28% at 100% 80%,#271d44 0,transparent 100%),#080d1b;color:var(--ink);font:500 15px/1.4 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}button,input{font:inherit}button{touch-action:manipulation;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed;transform:none!important}.shell{max-width:560px;margin:0 auto;padding:16px 18px max(28px,env(safe-area-inset-bottom));min-height:100svh}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:5px 0 16px}.logo{font-weight:950;letter-spacing:.06em;font-size:15px}.logo .accent{color:var(--gold)}.pill{background:#19233f;color:var(--muted);border:1px solid #303f65;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}.iconbtn{background:#1a2641;border:1px solid var(--stroke);color:var(--ink);border-radius:50%;width:37px;height:37px;display:inline-grid;place-items:center;font-size:17px}.topright{display:flex;align-items:center;gap:8px}.hero-art{position:relative;height:160px;display:grid;place-items:center;margin:6px 0 3px}.circle{position:absolute;width:180px;height:150px;background:radial-gradient(circle,#31557a77 0%,transparent 70%);filter:blur(5px)}.safe{height:129px;width:129px;border:9px solid #61729a;border-radius:31px;background:linear-gradient(140deg,#394766,#1c2946 60%,#18223a);box-shadow:0 0 0 7px #2d3957,inset 3px 5px 7px #ffffff20,0 28px 55px #0009;display:grid;place-items:center;transform:rotate(-8deg)}.safe:before{content:'✦';position:absolute;color:#f8bd5b;right:-28px;top:-20px;font-size:43px;text-shadow:0 0 30px #ffcc65}.dial{width:72px;height:72px;border-radius:50%;border:7px dashed #b4caec;box-shadow:inset 0 0 0 5px #202f52;background:radial-gradient(circle,#b8c6e5 0 8px,#7c93b8 9px 12px,transparent 13px);display:grid;place-items:center;font-size:22px}.hero-title{text-align:center;font-size:clamp(32px,9vw,50px);font-weight:1000;letter-spacing:-.06em;line-height:1.05;margin:7px 0 9px}.hero-title em{color:var(--gold);font-style:normal}.sub{text-align:center;color:var(--muted);max-width:390px;margin:0 auto 22px;font-size:14px}.panel{border:1px solid var(--stroke);background:linear-gradient(150deg,#1b2646,#11192f);border-radius:23px;padding:18px;margin:13px 0;box-shadow:0 12px 32px #0002}.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:var(--muted);margin-bottom:12px}.split{display:flex;justify-content:space-between;align-items:center;gap:8px}.number-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.opt{border:1px solid #334367;background:#121a33;color:var(--ink);border-radius:13px;min-height:48px;font-weight:950;font-size:18px}.opt.selected{border-color:#fbc77b;color:#ffd38a;background:#5e452a;box-shadow:inset 0 0 0 1px #f7c569}.input-group{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.playerinput{min-width:0;width:100%;border:1px solid #344267;background:#0c142b;color:var(--ink);border-radius:13px;padding:11px 12px;outline:none;font-size:14px;font-weight:700}.playerinput:focus{border-color:var(--gold)}.choice-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice-row .opt{font-size:13px;min-height:42px}.primary{border:0;background:linear-gradient(135deg,#ffe08e,#f5a947);color:#271b16;border-radius:15px;min-height:56px;padding:13px 22px;font-size:16px;letter-spacing:.02em;font-weight:1000;box-shadow:0 6px 0 #a36d2e,0 15px 24px #d9972720;width:100%}.primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 #a36d2e}.ghost{background:#17223e;border:1px solid #344360;color:var(--ink);border-radius:14px;padding:13px 15px;font-size:13px;font-weight:850}.muted{color:var(--muted)}.small{font-size:12px}.rules{display:flex;gap:10px;align-items:start;margin:11px 0;color:#bfc8e1;font-size:13px}.rules i{font-style:normal;font-size:19px}.footer{text-align:center;color:#7482a5;font-size:11px;padding:15px 0}.scoreboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 16px}.score{border:1px solid #334264;border-radius:16px;background:#121c35;display:flex;align-items:center;gap:10px;padding:11px 12px;min-width:0;position:relative}.score.active{border-color:#efbd67;box-shadow:inset 0 0 0 1px #efbd67;background:#27314b}.avatar{border-radius:13px;width:37px;height:37px;flex:none;display:grid;place-items:center;font-size:18px;background:var(--avatar,#485978)22}.score .name{font-size:12px;color:#c5d1e9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px}.score .points{font-size:21px;line-height:1.2;font-weight:950;font-variant-numeric:tabular-nums}.score .points small{font-size:10px;color:var(--muted);font-weight:650}.turn-head{text-align:center;margin:14px 0}.round{color:#b8c6e6;text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:900}.turn-name{font-size:28px;letter-spacing:-.04em;font-weight:1000;margin:7px 0 3px}.turn-copy{color:var(--muted);font-size:13px}.bank-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.metric{border:1px solid #334264;background:#101930;border-radius:17px;padding:12px 14px}.metric .label{color:#94a3c5;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.metric .value{font-size:30px;letter-spacing:-.04em;font-weight:1000;display:flex;gap:4px;align-items:baseline}.metric .value small{font-size:13px;color:#9baccc}.metric.loot .value{color:var(--gold)}.heat{display:flex;gap:5px;margin-top:8px}.heat span{height:7px;flex:1;border-radius:50px;background:#3e4c69}.heat span.on{background:var(--pink);box-shadow:0 0 8px #fa608477}.risk-caption{font-size:12px;color:#b8c5e6;text-align:center;margin-bottom:13px;min-height:32px}.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.door{position:relative;text-align:center;background:linear-gradient(150deg,#202e4f,#10192f);border:1px solid #496083;border-radius:18px;min-height:176px;padding:17px 6px 13px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink);transition:transform .1s}.door:active{transform:scale(.96)}.door:nth-child(2){background:linear-gradient(150deg,#244051,#122236);border-color:#467b8b}.door:nth-child(3){background:linear-gradient(150deg,#57344b,#241930);border-color:#8d4a6d}.door:disabled{opacity:.45}.door .emoji{font-size:39px;filter:drop-shadow(0 8px 7px #0005)}.door .doorname{font-size:13px;font-weight:950;line-height:1.15}.door .coins{font-size:18px;font-weight:1000;color:var(--gold)}.door .risk{font-size:10px;color:#bcc9e0}.door .tag{position:absolute;top:7px;right:7px;font-size:8px;letter-spacing:.06em;font-weight:1000;color:#ffb2c3;border:1px solid #e57d9c;border-radius:40px;padding:2px 5px}.bank-btn{margin-top:14px;width:100%;background:linear-gradient(135deg,#2b9b81,#167f72);border:1px solid #69efc6;border-radius:15px;color:white;font-weight:1000;font-size:16px;min-height:56px;box-shadow:0 5px 0 #0c5c50}.bank-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 3px 0 #0c5c50}.tools{margin-top:11px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.tool{background:#1b2542;border:1px solid #405374;color:#d4e0f9;border-radius:12px;padding:11px 7px;font-size:12px;font-weight:800}.status{border-radius:12px;background:#171f36;border:1px dashed #354363;color:#aebddf;text-align:center;padding:9px;font-size:12px;margin:12px 0}.handoff{min-height:62svh;display:flex;flex-direction:column;justify-content:center;text-align:center}.handoff-icon{font-size:65px;margin:9px 0 11px}.handoff h1{font-size:32px;line-height:1.1;letter-spacing:-.06em;margin:5px 0 12px}.handoff h1 b{color:var(--gold)}.handoff p{color:#a9b7d6;font-size:14px;line-height:1.5;margin:0 auto 22px;max-width:340px}.result-card{text-align:center;border-radius:22px;padding:23px 18px;border:1px solid #496083;background:linear-gradient(140deg,#243253,#11182f);margin:14px 0}.result-icon{font-size:62px}.result-title{font-weight:1000;font-size:25px;margin:8px 0}.result-text{color:#c3cce2;font-size:14px;line-height:1.55}.result-number{font-size:45px;color:var(--gold);font-weight:1000;letter-spacing:-.05em}.roundend{border:1px solid #34476b;background:#17203b;border-radius:17px;padding:13px 15px;margin:10px 0;text-align:center}.roundend strong{color:var(--gold)}.ranking{display:flex;flex-direction:column;gap:10px;margin:15px 0 20px}.rank{display:flex;align-items:center;gap:12px;background:#17213c;border:1px solid #374767;border-radius:15px;padding:12px}.rank .pos{font-size:21px;font-weight:1000;color:var(--gold);width:32px;text-align:center}.rank .pts{margin-left:auto;font-size:22px;font-weight:950;color:#ffe09a}.rank .pts small{font-size:10px;color:#b2c1db}.top-actions{display:flex;gap:8px;align-items:center}.tip{margin:13px auto 0;color:#8194bc;text-align:center;font-size:11px;max-width:360px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}.confetti i{position:absolute;top:-25px;width:9px;height:14px;border-radius:2px;animation:fall var(--d) linear forwards;background:var(--c);left:var(--x)}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(800deg);opacity:0}}.flash{animation:pop .27s ease-out}@keyframes pop{0%{transform:scale(.94);opacity:.5}100%{transform:scale(1);opacity:1}}.soundbtn{font-size:14px}.hidden{display:none!important}@media (min-width:520px){.shell{padding-top:24px}.hero-art{height:195px}.door{min-height:199px;padding-top:27px}.door .emoji{font-size:48px}.door .doorname{font-size:15px}}@media (max-width:350px){.shell{padding-left:12px;padding-right:12px}.door .emoji{font-size:32px}.door{min-height:164px}.score{padding:8px}.hero-title{font-size:34px}}
</style>

<body><main class="shell"><header class="top"><div class="logo">✦ GOLPE <span class="accent">MAESTRO</span></div><div class="topright"><button class="iconbtn soundbtn" id="sound" aria-label="Activar o desactivar sonido">🔇</button><button class="iconbtn" id="help" title="Reglas" aria-label="Ver las reglas">?</button></div></header><div id="app"></div><div class="footer">🎮 1 a 4 jugadores · Un solo celular · Sin instalaciones</div></main><div class="confetti" id="confetti"></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORAGE='golpe-maestro-v1';
const COLORS=['#f6bd60','#71d9bd','#9cafff','#fd87a0'];
const ICONS=['🦊','🐼','🐯','🐙'];
const NAMES=['Jugador 1','Jugador 2','Jugador 3','Jugador 4'];
const DOORS=[{label:'Discreto',emoji:'🧰',min:10,max:17,chance:.82,alert:1,desc:'Riesgo bajo',tag:''},{label:'Profesional',emoji:'💎',min:20,max:31,chance:.64,alert:1,desc:'Riesgo medio',tag:''},{label:'Todo o nada',emoji:'⚡',min:36,max:54,chance:.49,alert:2,desc:'Riesgo alto',tag:'PELIGRO'}];
let config={count:2,rounds:7,names:[...NAMES]}, state=null, audioOn=false;
let audioCtx=null;
function sound(note='tap'){
 if(!audioOn)return;
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=audioCtx||new C();let t=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=note==='bad'?'sawtooth':'sine';osc.frequency.setValueAtTime(note==='good'?630:note==='bad'?190:420,t);osc.frequency.exponentialRampToValueAtTime(note==='good'?930:note==='bad'?95:600,t+.15);gain.gain.setValueAtTime(.055,t);gain.gain.exponentialRampToValueAtTime(.001,t+.18);osc.connect(gain).connect(audioCtx.destination);osc.start(t);osc.stop(t+.19)}catch(e){}
}
function buzz(x=25){try{navigator.vibrate?.(x)}catch(e){}}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE));if(x&&x.version===1&&Array.isArray(x.players)&&x.players.length>=1&&x.players.length<=4&&x.rounds>0&&Number.isInteger(x.index)&&['handoff','playing','result','finished'].includes(x.phase))return x}catch(e){}return null}
function r(n){return Math.floor(Math.random()*n)}
function selectNum(n){config.count=n;renderSetup()}
function setupInputName(index,value){config.names[index]=value.slice(0,20)}
function setRounds(n){config.rounds=n;renderSetup()}
function start(){
 const names=Array.from(document.querySelectorAll('.playerinput')).map((x,i)=>(x.value.trim().slice(0,20)||NAMES[i]));
 for(let i=0;i<config.count;i++)config.names[i]=names[i];
 state={version:1,players:names.slice(0,config.count).map((name,i)=>({name,score:0,hacks:2,shields:0,color:COLORS[i],icon:ICONS[i]})),rounds:config.rounds,round:1,index:0,loot:0,alarm:0,pulls:0,phase:'handoff',last:null,history:[],bestTurn:0};save();render();sound('good');
}
function handoff(){state.phase='playing';state.loot=0;state.alarm=0;state.pulls=0;state.last=null;save();render();}
function next(){let nextIndex=state.index+1;if(nextIndex>=state.players.length){nextIndex=0;state.round++}state.index=nextIndex;state.phase=state.round>state.rounds?'finished':'handoff';state.last=null;save();render();if(state.phase==='finished'){celebrate();sound('good')}}
function bank(busted=false){if(state.phase!=='playing')return;const p=state.players[state.index],money=busted?0:state.loot;p.score+=money;state.bestTurn=Math.max(state.bestTurn,money);state.last={busted,money,pulls:state.pulls,name:p.name};state.history.push({name:p.name,round:state.round,money,busted});state.loot=0;state.phase='result';save();render();sound(busted?'bad':'good');if(busted)buzz([65,35,90]);}
function pull(kind){if(state.phase!=='playing')return;const d=DOORS[kind], p=state.players[state.index],pressure=Math.min(.19,Math.max(0,state.pulls-2)*.032),success=Math.random()<Math.max(.14,d.chance-pressure);state.pulls++;
 let msg='',ev='good';
 if(success){let coins=d.min+r(d.max-d.min+1);const jackpot=Math.random()<.115;if(jackpot)coins=Math.round(coins*1.7);state.loot+=coins;msg=(jackpot?'💠 ¡BOTÍN LEGENDARIO! ':'💰 ')+`Sumaste ${coins} fichas.`;if(Math.random()<.115){p.shields=Math.min(2,p.shields+1);msg+=' Encontraste un escudo 🛡️.'}if(Math.random()<.08){p.hacks=Math.min(4,p.hacks+1);msg+=' +1 hack 🧠.'}}
 else {let alert=d.alert; if(p.shields>0){p.shields--;alert=Math.max(0,alert-1);msg='🛡️ Tu escudo bloqueó 1 alarma. ';}state.alarm=Math.min(3,state.alarm+alert);msg+=alert?`🚨 Subió la alarma +${alert}.`:'¡Evitaste la alarma!';ev='bad';}
 state.lastMessage=msg;save();sound(ev);if(ev==='bad')buzz(45);
 if(state.alarm>=3){bank(true);state.last.message=msg;save();render()}else{render();let el=$('#eventmsg');if(el)el.classList.add('flash')}
}
function hack(){if(state.phase!=='playing')return;const p=state.players[state.index];if(p.hacks<=0||state.alarm<=0)return;p.hacks--;state.alarm--;state.lastMessage='🧠 Hack exitoso: bajaste 1 nivel de alarma.';save();render();sound('good')}
function useShield(){if(state.phase!=='playing')return;const p=state.players[state.index];if(p.shields<1)return;state.lastMessage='🛡️ Tu escudo está activo: se usará automáticamente ante la próxima alarma.';save();render()}
function restart(){if(!confirm('¿Terminar la partida y comenzar una nueva?'))return;state=null;try{localStorage.removeItem(STORAGE)}catch(e){}render()}
function openRules(){alert('CÓMO JUGAR\n\n1. Cada jugador tiene un turno por ronda.\n2. Elegí una bóveda para intentar ganar fichas. Cuanto más paga, más peligro tiene.\n3. Si ganás fichas, podés seguir o ESCAPAR y guardarlas.\n4. Si la alarma llega a 3, perdés todo el botín SIN GUARDAR de ese turno. Los puntos guardados nunca se pierden.\n5. Los hacks reducen la alarma en 1. Tenés 2 al empezar la partida.\n6. Podés encontrar escudos que bloquean una alarma automáticamente.\n7. Después de varias extracciones, los riesgos aumentan.\n8. Gana quien tiene más fichas al terminar todas las rondas. En solitario buscá superar tu récord.');}
function renderSetup(){
 let app=$('#app');app.innerHTML=`<div class="hero-art"><div class="circle"></div><div class="safe"><div class="dial">✦</div></div></div><h1 class="hero-title">GOLPE <em>MAESTRO</em></h1><p class="sub">Abrí bóvedas, robá el botín y escapá a tiempo. Si la alarma explota, ¡perdés todo lo de ese turno!</p><section class="panel"><div class="section-label">¿Cuántos van a jugar?</div><div class="number-grid">${[1,2,3,4].map(n=>`<button class="opt ${config.count===n?'selected':''}" data-count="${n}" aria-pressed="${config.count===n}">${n}</button>`).join('')}</div><div class="input-group">${config.names.slice(0,config.count).map((n,i)=>`<input class="playerinput" aria-label="Nombre del jugador ${i+1}" maxlength="20" placeholder="Jugador ${i+1}" value="${esc(n)}" data-player="${i}">`).join('')}</div></section><section class="panel"><div class="section-label">Duración de partida</div><div class="choice-row">${[5,7,10].map(n=>`<button class="opt ${n===config.rounds?'selected':''}" data-rounds="${n}">${n} rondas</button>`).join('')}</div><p class="small muted" style="margin:12px 0 0">${config.count===1?'Modo individual: competí contra tu propio récord.':'Multijugador local: pasen el celular en cada turno.'}</p></section><button class="primary" id="start">🔓 INICIAR PARTIDA</button><div class="panel" style="margin-top:22px"><div class="section-label">Reglas rápidas</div><div class="rules"><i>💎</i><span>Juntá puntos eligiendo entre 3 bóvedas con riesgos distintos.</span></div><div class="rules"><i>🚨</i><span>Al llegar a <b>3 alarmas</b>, perdés el botín que todavía no guardaste.</span></div><div class="rules"><i>🏃</i><span>Escapá antes de perderlo todo. ¡Gana el mayor puntaje!</span></div></div>`;
 app.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{app.querySelectorAll('.playerinput').forEach(x=>setupInputName(+x.dataset.player,x.value));selectNum(+b.dataset.count)});
 app.querySelectorAll('[data-rounds]').forEach(b=>b.onclick=()=>{app.querySelectorAll('.playerinput').forEach(x=>setupInputName(+x.dataset.player,x.value));setRounds(+b.dataset.rounds)});
 $('#start').onclick=start;
}
function scoreHtml(){return `<div class="scoreboard">${state.players.map((p,i)=>`<div class="score ${i===state.index&&state.phase!=='finished'?'active':''}"><div class="avatar" style="--avatar:${p.color}">${p.icon}</div><div style="min-width:0"><div class="name">${esc(p.name)}</div><div class="points">${p.score} <small>PTS</small></div></div></div>`).join('')}</div>`}
function renderHandoff(){const p=state.players[state.index];$('#app').innerHTML=`${scoreHtml()}<div class="handoff"><div class="round">RONDA ${state.round} DE ${state.rounds}</div><div class="handoff-icon">📱🤝</div><h1>Turno de<br><b>${esc(p.name)}</b></h1><p>${state.players.length>1?'Pasale el celular a esa persona. Cuando esté lista, puede empezar.':'Prepará tu próximo golpe. Recordá: a veces conviene escapar con lo que ya ganaste.'}</p><button id="ready" class="primary">🔓 ${state.players.length>1?'ESTOY LISTO':'JUGAR MI TURNO'}</button></div><div class="tip">Tus puntos guardados están a salvo. El botín del turno está en riesgo.</div>`;$('#ready').onclick=handoff}
function renderPlaying(){const p=state.players[state.index];$('#app').innerHTML=`<div class="split"><div class="round">RONDA ${state.round} / ${state.rounds}</div><button class="ghost" id="quit" style="padding:7px 12px;font-size:11px">↺ Reiniciar</button></div>${scoreHtml()}<div class="turn-head"><div class="round">LE TOCA A</div><div class="turn-name">${p.icon} ${esc(p.name)}</div><div class="turn-copy">Elegí una bóveda… ¿cuánto te vas a arriesgar?</div></div><div class="bank-row"><div class="metric loot"><div class="label">Botín sin guardar</div><div class="value">${state.loot}<small>PTS</small></div></div><div class="metric"><div class="label">Nivel de alarma</div><div class="value" style="color:${state.alarm===2?'#fd899f':'#e3ebff'}">${state.alarm}<small>/ 3</small></div><div class="heat">${[0,1,2].map(i=>`<span class="${i<state.alarm?'on':''}"></span>`).join('')}</div></div></div><div class="risk-caption" id="eventmsg">${esc(state.lastMessage||'Al principio es más seguro. ¡El peligro crece si seguís!')}</div><div class="doors">${DOORS.map((d,i)=>`<button class="door" data-door="${i}">${d.tag?`<span class="tag">${d.tag}</span>`:''}<span class="emoji">${d.emoji}</span><span class="doorname">${d.label}</span><span class="coins">+${d.min}–${d.max}</span><span class="risk">${d.desc}</span></button>`).join('')}</div><button class="bank-btn" id="bank" ${state.loot<=0?'disabled':''}>🏃 ESCAPAR Y GUARDAR ${state.loot} PTS</button><div class="tools"><button class="tool" id="hack" ${p.hacks<=0||state.alarm===0?'disabled':''}>🧠 Hackear alarma (${p.hacks})</button><button class="tool" id="shield" ${p.shields<=0?'disabled':''}>🛡️ Escudos: ${p.shields}</button></div><div class="tip">El hack baja una alarma. Los escudos se aplican solos. Cada intento extra aumenta el riesgo.</div>`;
 $('#quit').onclick=restart;$('#bank').onclick=()=>bank(false);$('#hack').onclick=hack;$('#shield').onclick=useShield;document.querySelectorAll('[data-door]').forEach(b=>b.onclick=()=>pull(+b.dataset.door));}
function renderResult(){const x=state.last,p=state.players[state.index];$('#app').innerHTML=`${scoreHtml()}<div class="result-card"><div class="round">RONDA ${state.round} / ${state.rounds}</div><div class="result-icon">${x.busted?'💥':'💰'}</div><div class="result-title">${x.busted?'¡SALTÓ LA ALARMA!':'¡BOTÍN ASEGURADO!'}</div><div class="result-number">${x.busted?'0':'+'+x.money} <span style="font-size:18px">PTS</span></div><div class="result-text">${x.busted?`Perdiste las fichas que llevabas en este turno. ${x.message?esc(x.message):''}`:`Bien jugado, ${esc(p.name)}. Tus fichas ya están a salvo.`}<br>Intentos realizados: <b>${x.pulls}</b></div></div><div class="roundend">Puntaje total de <b>${esc(p.name)}</b>: <strong>${p.score} PTS</strong></div><button class="primary" id="next">${state.players.length===1?'CONTINUAR':'SIGUIENTE JUGADOR'} →</button>`;$('#next').onclick=next}
function medal(score,rounds){let factor=score/rounds;return factor>=65?['🏆','Leyenda de las bóvedas']:factor>=45?['🥇','Maestro del golpe']:factor>=27?['🥈','Ladrón profesional']:['🥉','Aprendiz de ladrón']}
function getBest(){try{return +(localStorage.getItem('golpe-maestro-solo-best')||0)}catch(e){return 0}}
function saveBest(s){try{localStorage.setItem('golpe-maestro-solo-best',String(s))}catch(e){}}
function renderFinished(){let players=state.players.map((p,i)=>({...p,idx:i})).sort((a,b)=>b.score-a.score),top=players[0].score,winners=players.filter(p=>p.score===top),solo=players.length===1,med=medal(top,state.rounds),best=getBest(),isRecord=solo&&top>best;if(isRecord){saveBest(top);best=top}
 $('#app').innerHTML=`<div class="handoff" style="min-height:auto;padding-top:18px"><div class="handoff-icon">${solo?med[0]:'🏆'}</div><div class="round">PARTIDA TERMINADA</div><h1 style="margin:12px 0">${solo?'¡Golpe completado!':winners.length>1?'¡Empate!':'¡Tenemos ganador!'}</h1><p style="margin-bottom:8px">${solo?med[1]:`Se lleva la gloria: ${winners.map(p=>esc(p.name)).join(' y ')}.`}</p>${solo?`<div class="result-number">${top} <small style="font-size:15px">PTS</small></div><p style="margin:5px 0 14px">${isRecord?'✨ ¡Nuevo récord personal!':`Tu récord: ${best} puntos`}</p>`:''}</div>${!solo?`<div class="section-label" style="margin-top:18px">CLASIFICACIÓN FINAL</div><div class="ranking">${players.map((p,i)=>`<div class="rank"><div class="pos">${i===0?'👑':i+1}</div><div class="avatar" style="--avatar:${p.color}">${p.icon}</div><strong>${esc(p.name)}</strong><span class="pts">${p.score} <small>PTS</small></span></div>`).join('')}</div>`:''}<section class="panel"><div class="split"><span class="muted small">Mayor botín de un turno</span><b style="color:var(--gold)">${state.bestTurn} PTS</b></div><div class="split" style="margin-top:8px"><span class="muted small">Rondas jugadas</span><b>${state.rounds}</b></div></section><button class="primary" id="again">🔁 JUGAR OTRA VEZ</button><p class="tip">Para cambiar el número de jugadores o la duración, elegí Nueva configuración.</p><button class="ghost" style="width:100%;margin-top:12px" id="newcfg">⚙ Nueva configuración</button>`;
 $('#again').onclick=()=>{let old=state;config.count=old.players.length;config.rounds=old.rounds;config.names=old.players.map(p=>p.name).concat(NAMES).slice(0,4);startFromConfig()};$('#newcfg').onclick=()=>{let old=state;config.count=old.players.length;config.rounds=old.rounds;config.names=old.players.map(p=>p.name).concat(NAMES).slice(0,4);state=null;save();render()};
}
function startFromConfig(){state={version:1,players:config.names.slice(0,config.count).map((name,i)=>({name,score:0,hacks:2,shields:0,color:COLORS[i],icon:ICONS[i]})),rounds:config.rounds,round:1,index:0,loot:0,alarm:0,pulls:0,phase:'handoff',last:null,history:[],bestTurn:0};save();render()}
function celebrate(){const c=$('#confetti');c.innerHTML='';for(let i=0;i<65;i++){let e=document.createElement('i');e.style.setProperty('--x',Math.round(Math.random()*100)+'%');e.style.setProperty('--dx',Math.round((Math.random()-.5)*180)+'px');e.style.setProperty('--d',(2+Math.random()*2.5).toFixed(2)+'s');e.style.setProperty('--c',['#ffcf6c','#4ee1b7','#80a6ff','#ff7f9e'][i%4]);e.style.animationDelay=(Math.random()*.8).toFixed(2)+'s';c.appendChild(e)}setTimeout(()=>c.innerHTML='',5300)}
function render(){if(!state)return renderSetup();if(state.phase==='handoff')return renderHandoff();if(state.phase==='playing')return renderPlaying();if(state.phase==='result')return renderResult();if(state.phase==='finished')return renderFinished()}
$('#help').onclick=openRules;$('#sound').onclick=()=>{audioOn=!audioOn;$('#sound').textContent=audioOn?'🔊':'🔇';if(audioOn)sound('good')};
state=load();render();
})();
</script>
</body>
</html>
